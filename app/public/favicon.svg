<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="60%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Cyan to Electric Blue Vector Gradient -->
    <linearGradient id="vGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#1A62FF" />
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D Layering -->
    <filter id="kvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00D2FF" flood-opacity="0.35" />
    </filter>
    
    <filter id="foldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="512" height="512" rx="118" fill="url(#bgGradient)" />
  <rect width="508" height="508" x="2" y="2" rx="116" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="3" />

  <!-- KV Monogram Geometric Shapes -->
  <g transform="translate(30, 20) scale(0.88)">
    <!-- Cyan Vector "V" (Lower folded checkmark) -->
    <path 
      d="M 200 240 L 290 345 L 430 185 L 460 215 L 290 410 L 160 260 Z" 
      fill="url(#vGradient)" 
      filter="url(#kvGlow)"
    />

    <!-- Pure White "K" Upper Diagonal Arm -->
    <path 
      d="M 180 220 L 320 85 L 365 85 L 235 230 Z" 
      fill="#FFFFFF" 
      filter="url(#foldShadow)"
    />

    <!-- Pure White "K" Vertical Left Stem -->
    <path 
      d="M 140 60 L 200 115 L 200 320 L 140 375 Z" 
      fill="#F8FAFC" 
    />
  </g>
</svg>
